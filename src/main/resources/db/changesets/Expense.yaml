databaseChangeLog:
  - changeSet:
      id: create-expense-tables
      author: admin
      changes:
        - createTable:
            tableName: expense
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: uuid
                  type: uuid
                  constraints:
                    unique: true
                    nullable: false
              - column:
                  name: voucher_number
                  type: varchar(50)
                  constraints:
                    unique: true
              - column:
                  name: expense_type
                  type: varchar(100)
              - column:
                  name: expense_date
                  type: date
              - column:
                  name: supplier_name
                  type: varchar(255)
              - column:
                  name: supplier_gstin
                  type: varchar(100)
              - column:
                  name: supplier_state
                  type: varchar(100)
              - column:
                  name: invoice_number
                  type: varchar(100)
              - column:
                  name: invoice_date
                  type: date
              - column:
                  name: subtotal_paise
                  type: bigint
                  defaultValueNumeric: 0
              - column:
                  name: tax_paise
                  type: bigint
                  defaultValueNumeric: 0
              - column:
                  name: total_paise
                  type: bigint
                  defaultValueNumeric: 0
              - column:
                  name: status
                  type: varchar(50)
                  defaultValue: PENDING
              - column:
                  name: notes
                  type: text
              - column:
                  name: created_at
                  type: timestamp with time zone
              - column:
                  name: updated_at
                  type: timestamp with time zone

        - createTable:
            tableName: expense_line_item
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: expense_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: text
              - column:
                  name: hsn_code
                  type: varchar(50)
              - column:
                  name: quantity
                  type: numeric(10,2)
                  defaultValueNumeric: 1
              - column:
                  name: rate_paise
                  type: bigint
                  defaultValueNumeric: 0
              - column:
                  name: gst_rate
                  type: numeric(5,2)
                  defaultValueNumeric: 18
              - column:
                  name: line_total_paise
                  type: bigint
                  defaultValueNumeric: 0

        - addForeignKeyConstraint:
            baseTableName: expense_line_item
            baseColumnNames: expense_id
            constraintName: fk_expense_line_item_expense
            referencedTableName: expense
            referencedColumnNames: id
            onDelete: CASCADE

