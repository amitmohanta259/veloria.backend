databaseChangeLog:

  # ── Per-line HSN on a purchase order ──────────────────────────────────────
  # The purchase order header already carries the vendor's GSTIN, invoice
  # number and the GST extracted from their invoice PDF. What it lacked was
  # line-level HSN, without which a vendor invoice recorded from a PO has to be
  # retyped rather than prefilled.
  - changeSet:
      id: gst-phase11-001-purchase-order-item-hsn
      author: veloria
      changes:
        - addColumn:
            tableName: purchase_order_item
            columns:
              - column: { name: hsn_code, type: varchar(8) }

  # A purchase order becomes at most one purchase invoice. The unique index
  # makes recording it twice impossible at the database, not merely unlikely —
  # a second one would double the input credit claimed.
  - changeSet:
      id: gst-phase11-002-one-invoice-per-purchase-order
      author: veloria
      changes:
        - sql:
            sql: >
              CREATE UNIQUE INDEX ux_purchase_invoice_purchase_order
              ON purchase_invoice (purchase_order_id)
              WHERE purchase_order_id IS NOT NULL
      rollback:
        - sql:
            sql: DROP INDEX IF EXISTS ux_purchase_invoice_purchase_order
