databaseChangeLog:
  - changeSet:
      id: create_sales_order_table
      author: admin
      changes:
        - createTable:
            tableName: sales_order
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: uuid
                  type: uuid
                  constraints:
                    unique: true
                    nullable: false
              - column:
                  name: order_code
                  type: varchar(50)
                  constraints:
                    unique: true
                    nullable: false
              - column:
                  name: product_uuid
                  type: uuid
              - column:
                  name: product_name
                  type: varchar(255)
              - column:
                  name: sku_id
                  type: varchar(100)
              - column:
                  name: quantity
                  type: integer
                  defaultValueNumeric: 1
              - column:
                  name: unit_price
                  type: bigint
              - column:
                  name: total_value
                  type: bigint
              - column:
                  name: currency
                  type: varchar(10)
                  defaultValue: INR
              - column:
                  name: customer_name
                  type: varchar(255)
              - column:
                  name: customer_email
                  type: varchar(255)
              - column:
                  name: status
                  type: varchar(50)
                  defaultValue: ORDER_PLACED
              - column:
                  name: return_window_days
                  type: integer
                  defaultValueNumeric: 30
              - column:
                  name: order_placed_at
                  type: timestamp
              - column:
                  name: active
                  type: boolean
                  defaultValueBoolean: true
              - column:
                  name: archive
                  type: boolean
                  defaultValueBoolean: false
              - column:
                  name: created
                  type: timestamp
              - column:
                  name: modified
                  type: timestamp
              - column:
                  name: created_by
                  type: varchar(255)
              - column:
                  name: modified_by
                  type: varchar(255)
