databaseChangeLog:
  - changeSet:
      id: create_users_table
      author: Abhishek
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: uuid
                  type: uuid
                  constraints:
                    unique: true
                    nullable: false
              - column:
                  name: user_name
                  type: varchar
              - column:
                  name: iam_id
                  type: varchar(255)
              - column:
                  name: first_name
                  type: varchar(255)
              - column:
                  name: category
                  type: varchar
              - column:
                  name: last_name
                  type: varchar(255)
              - column:
                  name: middle_name
                  type: varchar(255)
              - column:
                  name: email
                  type: varchar(255)
              - column:
                  name: phone
                  type: varchar(255)
              - column:
                  name: dob
                  type: varchar(255)
              - column:
                  name: gender
                  type: varchar
              - column:
                  name: avatar
                  type: varchar(255)
              - column:
                  name: fax
                  type: varchar(255)
              - column:
                  name: last_login
                  type: timestamp
              - column:
                  name: role
                  type: varchar(255)
              - column:
                  name: role_type
                  type: varchar(255)
              - column:
                  name: active
                  type: boolean
              - column:
                  name: archive
                  type: boolean
              - column:
                  name: created
                  type: timestamp
              - column:
                  name: modified
                  type: timestamp
              - column:
                  name: created_by
                  type: varchar(255)
              - column:
                  name: modified_by
                  type: varchar(255)