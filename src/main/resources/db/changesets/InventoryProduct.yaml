databaseChangeLog:
  - changeSet:
      id: create_inventory_product_table
      author: Abhishek
      changes:
        - createTable:
            tableName: inventory_product
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: uuid
                  type: uuid
                  constraints:
                    unique: true
                    nullable: false
              - column:
                  name: sub_category_id
                  type: bigint
              - column:
                  name: name
                  type: text
              - column:
                  name: description
                  type: text
              - column:
                  name: sku_id
                  type: text
              - column:
                  name: price
                  type: bigint
              - column:
                  name: price_currency
                  type: varchar(50)
              - column:
                  name: initial_stock
                  type: bigint
              - column:
                  name: visibility
                  type: varchar(50)
              - column:
                  name: visibility_date
                  type: timestamp
              - column:
                  name: draft
                  type: boolean
              - column:
                  name: active
                  type: boolean
              - column:
                  name: archive
                  type: boolean
              - column:
                  name: created
                  type: timestamp
              - column:
                  name: modified
                  type: timestamp
              - column:
                  name: created_by
                  type: varchar(255)
              - column:
                  name: modified_by
                  type: varchar(255)
  - changeSet:
      id: add_index_inventory_product_sub_category_id
      author: veloria-perf
      changes:
        - createIndex:
            tableName: inventory_product
            indexName: idx_inventory_product_sub_category_id
            columns:
              - column:
                  name: sub_category_id