databaseChangeLog:
  - changeSet:
      id: create_staff_insurance_coverage_table
      author: Abhishek
      changes:
        - createTable:
            tableName: staff_insurance_coverage
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: staff_id
                  type: bigint
              - column:
                  name: insurance_provider
                  type: varchar(255)
              - column:
                  name: policy_id
                  type: varchar(255)