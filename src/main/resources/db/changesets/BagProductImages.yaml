      changes:
        - sql:
            sql: |
              -- Mini Satchel: replace 404 URL with working one
              UPDATE inventory_product_images
              SET image = 'https://images.unsplash.com/photo-1591348278863-a8fb3887e2aa?auto=format&w=800&q=80'
