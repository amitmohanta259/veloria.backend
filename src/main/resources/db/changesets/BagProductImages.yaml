              INSERT INTO inventory_product_images (uuid, product_id, image, created)
              SELECT gen_random_uuid(), id, 'https://images.unsplash.com/photo-1548036328-c9fa89d128fa?auto=format&w=800&q=80', now()
              FROM inventory_product WHERE uuid = 'f209f33c-8c87-4f47-b1f5-95a6487fd8b9'
