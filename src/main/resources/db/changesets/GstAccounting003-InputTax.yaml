databaseChangeLog:
  - changeSet:
      id: gst-accounting-003-input-tax
      author: veloria
      changes:
        - createTable:
            tableName: gst_input_tax
            columns:
              - column:
                  name: id
                  type: bigserial
                  constraints:
                    primaryKey: true
              - column:
                  name: purchase_order_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: purchase_order_uuid
                  type: uuid
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: vendor_gstin
                  type: varchar(15)
              - column:
                  name: vendor_name
                  type: varchar(255)
              - column:
                  name: vendor_state_code
                  type: varchar(2)
              - column:
                  name: invoice_number
                  type: varchar(100)
              - column:
                  name: invoice_date
                  type: date
              - column:
                  name: financial_year
                  type: varchar(7)
              - column:
                  name: tax_period
                  type: varchar(7)
              - column:
                  name: taxable_value
                  type: bigint
                  defaultValueNumeric: 0
              - column:
                  name: cgst_rate
                  type: numeric(5,2)
                  defaultValueNumeric: 0
              - column:
                  name: cgst_amount
                  type: bigint
                  defaultValueNumeric: 0
              - column:
                  name: sgst_rate
                  type: numeric(5,2)
                  defaultValueNumeric: 0
              - column:
                  name: sgst_amount
                  type: bigint
                  defaultValueNumeric: 0
              - column:
                  name: igst_rate
                  type: numeric(5,2)
                  defaultValueNumeric: 0
              - column:
                  name: igst_amount
                  type: bigint
                  defaultValueNumeric: 0
              - column:
                  name: total_input_tax
                  type: bigint
                  defaultValueNumeric: 0
              - column:
                  name: itc_eligibility
                  type: varchar(30)
                  defaultValue: PENDING_REVIEW
              - column:
                  name: eligible_cgst
                  type: bigint
                  defaultValueNumeric: 0
              - column:
                  name: eligible_sgst
                  type: bigint
                  defaultValueNumeric: 0
              - column:
                  name: eligible_igst
                  type: bigint
                  defaultValueNumeric: 0
              - column:
                  name: ineligible_cgst
                  type: bigint
                  defaultValueNumeric: 0
              - column:
                  name: ineligible_sgst
                  type: bigint
                  defaultValueNumeric: 0
              - column:
                  name: ineligible_igst
                  type: bigint
                  defaultValueNumeric: 0
              - column:
                  name: itc_status
                  type: varchar(30)
                  defaultValue: PENDING_REVIEW
              - column:
                  name: reversal_amount
                  type: bigint
                  defaultValueNumeric: 0
              - column:
                  name: reversal_reason
                  type: text
              - column:
                  name: reclaimed_amount
                  type: bigint
                  defaultValueNumeric: 0
              - column:
                  name: goods_received
                  type: boolean
                  defaultValueBoolean: false
              - column:
                  name: gstr2b_match_status
                  type: varchar(30)
                  defaultValue: PENDING_REVIEW
              - column:
                  name: itc_claimed_period
                  type: varchar(7)
              - column:
                  name: remarks
                  type: text
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: NOW()
              - column:
                  name: updated_at
                  type: timestamp
                  defaultValueComputed: NOW()
        - createIndex:
            tableName: gst_input_tax
            indexName: idx_gst_input_tax_period
            columns:
              - column:
                  name: tax_period
        - createIndex:
            tableName: gst_input_tax
            indexName: idx_gst_input_tax_vendor_gstin
            columns:
              - column:
                  name: vendor_gstin
        - createIndex:
            tableName: gst_input_tax
            indexName: idx_gst_input_tax_po_uuid
            columns:
              - column:
                  name: purchase_order_uuid
