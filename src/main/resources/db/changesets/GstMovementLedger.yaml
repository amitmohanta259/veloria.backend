databaseChangeLog:
  - changeSet:
      id: gst-movement-ledger-001
      author: veloria
      changes:
        - createSequence:
            sequenceName: gst_movement_seq
            startValue: 1
            incrementBy: 1

        - createTable:
            tableName: gst_movement_ledger
            columns:
              - column:
                  name: id
                  type: bigserial
                  constraints:
                    primaryKey: true
              - column:
                  name: movement_number
                  type: varchar(40)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: movement_type
                  type: varchar(60)
                  constraints:
                    nullable: false
              - column:
                  name: direction
                  type: varchar(15)
                  constraints:
                    nullable: false
              - column:
                  name: source_type
                  type: varchar(50)
              - column:
                  name: source_id
                  type: bigint
              - column:
                  name: source_document_number
                  type: varchar(100)
              - column:
                  name: original_document_id
                  type: bigint
              - column:
                  name: original_document_number
                  type: varchar(100)
              - column:
                  name: transaction_date
                  type: date
              - column:
                  name: tax_period
                  type: varchar(7)
              - column:
                  name: financial_year
                  type: varchar(7)
              - column:
                  name: business_gstin
                  type: varchar(15)
              - column:
                  name: counterparty_gstin
                  type: varchar(15)
              - column:
                  name: counterparty_name
                  type: varchar(255)
              - column:
                  name: counterparty_type
                  type: varchar(20)
              - column:
                  name: product_uuid
                  type: varchar(36)
              - column:
                  name: product_name
                  type: varchar(255)
              - column:
                  name: sku_id
                  type: varchar(100)
              - column:
                  name: hsn_code
                  type: varchar(20)
              - column:
                  name: quantity
                  type: integer
                  defaultValueNumeric: 1
              - column:
                  name: unit_price_paise
                  type: bigint
                  defaultValueNumeric: 0
              - column:
                  name: taxable_value_paise
                  type: bigint
                  defaultValueNumeric: 0
              - column:
                  name: cgst_rate_bp
                  type: integer
                  defaultValueNumeric: 0
              - column:
                  name: sgst_rate_bp
                  type: integer
                  defaultValueNumeric: 0
              - column:
                  name: igst_rate_bp
                  type: integer
                  defaultValueNumeric: 0
              - column:
                  name: cgst_amount_paise
                  type: bigint
                  defaultValueNumeric: 0
              - column:
                  name: sgst_amount_paise
                  type: bigint
                  defaultValueNumeric: 0
              - column:
                  name: igst_amount_paise
                  type: bigint
                  defaultValueNumeric: 0
              - column:
                  name: total_tax_paise
                  type: bigint
                  defaultValueNumeric: 0
              - column:
                  name: itc_status
                  type: varchar(30)
              - column:
                  name: place_of_supply
                  type: varchar(2)
              - column:
                  name: seller_state_code
                  type: varchar(2)
              - column:
                  name: buyer_state_code
                  type: varchar(2)
              - column:
                  name: supply_type
                  type: varchar(20)
              - column:
                  name: reverse_charge
                  type: boolean
                  defaultValueBoolean: false
              - column:
                  name: reference_transaction_id
                  type: bigint
              - column:
                  name: reference_return_id
                  type: bigint
              - column:
                  name: reference_credit_note_id
                  type: bigint
              - column:
                  name: status
                  type: varchar(20)
                  defaultValue: POSTED
              - column:
                  name: reason
                  type: text
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: NOW()
              - column:
                  name: created_by
                  type: varchar(100)

        - createIndex:
            tableName: gst_movement_ledger
            indexName: idx_gml_tax_period
            columns:
              - column:
                  name: tax_period
        - createIndex:
            tableName: gst_movement_ledger
            indexName: idx_gml_movement_type
            columns:
              - column:
                  name: movement_type
        - createIndex:
            tableName: gst_movement_ledger
            indexName: idx_gml_source
            columns:
              - column:
                  name: source_type
              - column:
                  name: source_id

  - changeSet:
      id: gst-credit-note-001
      author: veloria
      changes:
        - createSequence:
            sequenceName: gst_credit_note_seq
            startValue: 1
            incrementBy: 1

        - createTable:
            tableName: gst_credit_note
            columns:
              - column:
                  name: id
                  type: bigserial
                  constraints:
                    primaryKey: true
              - column:
                  name: credit_note_number
                  type: varchar(40)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: original_order_code
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: original_order_id
                  type: bigint
              - column:
                  name: return_request_id
                  type: bigint
              - column:
                  name: customer_id
                  type: varchar(36)
              - column:
                  name: customer_name
                  type: varchar(255)
              - column:
                  name: customer_gstin
                  type: varchar(15)
              - column:
                  name: tax_period
                  type: varchar(7)
              - column:
                  name: financial_year
                  type: varchar(7)
              - column:
                  name: original_tax_period
                  type: varchar(7)
              - column:
                  name: credit_note_date
                  type: date
              - column:
                  name: taxable_value_paise
                  type: bigint
                  defaultValueNumeric: 0
              - column:
                  name: cgst_paise
                  type: bigint
                  defaultValueNumeric: 0
              - column:
                  name: sgst_paise
                  type: bigint
                  defaultValueNumeric: 0
              - column:
                  name: igst_paise
                  type: bigint
                  defaultValueNumeric: 0
              - column:
                  name: total_credit_paise
                  type: bigint
                  defaultValueNumeric: 0
              - column:
                  name: supply_type
                  type: varchar(20)
              - column:
                  name: place_of_supply
                  type: varchar(2)
              - column:
                  name: condition
                  type: varchar(20)
              - column:
                  name: status
                  type: varchar(30)
                  defaultValue: ISSUED
              - column:
                  name: notes
                  type: text
              - column:
                  name: movement_id
                  type: bigint
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: NOW()

        - createIndex:
            tableName: gst_credit_note
            indexName: idx_gcn_order_code
            columns:
              - column:
                  name: original_order_code
        - createIndex:
            tableName: gst_credit_note
            indexName: idx_gcn_tax_period
            columns:
              - column:
                  name: tax_period
