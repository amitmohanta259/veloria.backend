databaseChangeLog:
  - changeSet:
      id: create_supplier_table
      author: admin
      changes:
        - createTable:
            tableName: supplier
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: uuid
                  type: uuid
                  constraints:
                    unique: true
                    nullable: false
              - column:
                  name: supplier_code
                  type: varchar(50)
                  constraints:
                    unique: true
                    nullable: false
              - column:
                  name: name
                  type: text
              - column:
                  name: registration_name
                  type: text
              - column:
                  name: gstn
                  type: varchar(100)
              - column:
                  name: category
                  type: varchar(100)
              - column:
                  name: status
                  type: varchar(50)
              - column:
                  name: country
                  type: varchar(100)
              - column:
                  name: city
                  type: varchar(100)
              - column:
                  name: postal_address
                  type: text
              - column:
                  name: website
                  type: varchar(255)
              - column:
                  name: contact_name
                  type: varchar(255)
              - column:
                  name: contact_email
                  type: varchar(255)
              - column:
                  name: contact_phone
                  type: varchar(50)
              - column:
                  name: payment_terms
                  type: varchar(100)
              - column:
                  name: settlement_currency
                  type: varchar(20)
              - column:
                  name: bank_name
                  type: varchar(255)
              - column:
                  name: swift_code
                  type: varchar(50)
              - column:
                  name: account_number
                  type: varchar(100)
              - column:
                  name: product_tags
                  type: text
              - column:
                  name: lead_time
                  type: varchar(100)
              - column:
                  name: moq
                  type: varchar(100)
              - column:
                  name: notes
                  type: text
              - column:
                  name: active
                  type: boolean
                  defaultValueBoolean: true
              - column:
                  name: archive
                  type: boolean
                  defaultValueBoolean: false
              - column:
                  name: created
                  type: timestamp
              - column:
                  name: modified
                  type: timestamp
              - column:
                  name: created_by
                  type: varchar(255)
              - column:
                  name: modified_by
                  type: varchar(255)
