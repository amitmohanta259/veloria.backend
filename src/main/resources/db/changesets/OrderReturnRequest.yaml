databaseChangeLog:
  - changeSet:
      id: create_order_return_request_table
      author: veloria
      changes:
        - createTable:
            tableName: order_return_request
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: uuid
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: order_code
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: customer_id
                  type: VARCHAR(100)
              - column:
                  name: item_uuid
                  type: VARCHAR(36)
              - column:
                  name: return_type
                  type: VARCHAR(20)
              - column:
                  name: reason
                  type: TEXT
              - column:
                  name: front_image
                  type: TEXT
              - column:
                  name: back_image
                  type: TEXT
              - column:
                  name: tag_image
                  type: TEXT
              - column:
                  name: verification_status
                  type: VARCHAR(20)
              - column:
                  name: verification_notes
                  type: TEXT
              - column:
                  name: archive
                  type: BOOLEAN
                  defaultValueBoolean: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: NOW()
