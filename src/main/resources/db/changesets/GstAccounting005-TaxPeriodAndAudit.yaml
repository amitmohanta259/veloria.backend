databaseChangeLog:
  - changeSet:
      id: gst-accounting-005-tax-period
      author: veloria
      changes:
        - createTable:
            tableName: gst_tax_period
            columns:
              - column:
                  name: id
                  type: bigserial
                  constraints:
                    primaryKey: true
              - column:
                  name: financial_year
                  type: varchar(7)
                  constraints:
                    nullable: false
              - column:
                  name: tax_period
                  type: varchar(7)
                  constraints:
                    nullable: false
              - column:
                  name: period_start_date
                  type: date
              - column:
                  name: period_end_date
                  type: date
              - column:
                  name: status
                  type: varchar(20)
                  defaultValue: OPEN
              - column:
                  name: total_outward_taxable_value
                  type: bigint
                  defaultValueNumeric: 0
              - column:
                  name: output_cgst
                  type: bigint
                  defaultValueNumeric: 0
              - column:
                  name: output_sgst
                  type: bigint
                  defaultValueNumeric: 0
              - column:
                  name: output_igst
                  type: bigint
                  defaultValueNumeric: 0
              - column:
                  name: total_output_tax
                  type: bigint
                  defaultValueNumeric: 0
              - column:
                  name: total_inward_taxable_value
                  type: bigint
                  defaultValueNumeric: 0
              - column:
                  name: input_cgst
                  type: bigint
                  defaultValueNumeric: 0
              - column:
                  name: input_sgst
                  type: bigint
                  defaultValueNumeric: 0
              - column:
                  name: input_igst
                  type: bigint
                  defaultValueNumeric: 0
              - column:
                  name: total_input_tax
                  type: bigint
                  defaultValueNumeric: 0
              - column:
                  name: eligible_cgst_itc
                  type: bigint
                  defaultValueNumeric: 0
              - column:
                  name: eligible_sgst_itc
                  type: bigint
                  defaultValueNumeric: 0
              - column:
                  name: eligible_igst_itc
                  type: bigint
                  defaultValueNumeric: 0
              - column:
                  name: reversed_cgst
                  type: bigint
                  defaultValueNumeric: 0
              - column:
                  name: reversed_sgst
                  type: bigint
                  defaultValueNumeric: 0
              - column:
                  name: reversed_igst
                  type: bigint
                  defaultValueNumeric: 0
              - column:
                  name: net_cgst_liability
                  type: bigint
                  defaultValueNumeric: 0
              - column:
                  name: net_sgst_liability
                  type: bigint
                  defaultValueNumeric: 0
              - column:
                  name: net_igst_liability
                  type: bigint
                  defaultValueNumeric: 0
              - column:
                  name: cash_cgst_payable
                  type: bigint
                  defaultValueNumeric: 0
              - column:
                  name: cash_sgst_payable
                  type: bigint
                  defaultValueNumeric: 0
              - column:
                  name: cash_igst_payable
                  type: bigint
                  defaultValueNumeric: 0
              - column:
                  name: total_cash_payable
                  type: bigint
                  defaultValueNumeric: 0
              - column:
                  name: return_status
                  type: varchar(20)
                  defaultValue: NOT_PREPARED
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: NOW()
              - column:
                  name: updated_at
                  type: timestamp
                  defaultValueComputed: NOW()
        - addUniqueConstraint:
            tableName: gst_tax_period
            columnNames: tax_period
            constraintName: uq_gst_tax_period

  - changeSet:
      id: gst-accounting-005-audit-log
      author: veloria
      changes:
        - createTable:
            tableName: gst_audit_log
            columns:
              - column:
                  name: id
                  type: bigserial
                  constraints:
                    primaryKey: true
              - column:
                  name: entity_type
                  type: varchar(50)
              - column:
                  name: entity_id
                  type: bigint
              - column:
                  name: action
                  type: varchar(50)
              - column:
                  name: old_value
                  type: text
              - column:
                  name: new_value
                  type: text
              - column:
                  name: changed_by
                  type: varchar(100)
              - column:
                  name: changed_at
                  type: timestamp
                  defaultValueComputed: NOW()
              - column:
                  name: reason
                  type: text
