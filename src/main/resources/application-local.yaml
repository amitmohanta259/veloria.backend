server:
  port: 8081

spring:
  application:
    name: master-service

  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  hikari:
    maximum-pool-size: 10
    minimum-idle: 2
    connection-timeout: 20000
    idle-timeout: 600000
    max-lifetime: 1800000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

management:
  endpoints:
    web:
      exposure:
        include: '*'

keycloak:
  realm: veloria
  tenant-realm: tenant-group
  base-url: https://dev.auth.veloriafashion.com
  auth-url: https://dev.auth.veloriafashion.com
  client-id: veloria-backend
  client-secret: ${KEYCLOAK_CLIENT_SECRET:dummy-client-secret}

logging:
  level:
    reactor:
      netty: DEBUG
    org:
      springframework:
        cloud:
          gateway: DEBUG