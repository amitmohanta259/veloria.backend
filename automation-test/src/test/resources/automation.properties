# Defaults for a local developer machine. Every key can be overridden by an
# environment variable of the same name (VELORIA_API_URL etc.), which is how
# CI points the suite at a dedicated test environment.
VELORIA_API_URL=http://localhost:8081/api/master
VELORIA_DB_URL=jdbc:postgresql://localhost:5432/postgres
VELORIA_DB_USER=postgres
VELORIA_DB_PASSWORD=postgres
